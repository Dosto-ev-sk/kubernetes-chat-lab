<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kubernetes Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f4f4;
    }
    h1 {
      text-align: center;
    }
    #chat {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #messages {
      border: 1px solid #ccc;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 15px;
      background: #fafafa;
    }
    .message {
      margin-bottom: 10px;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    input {
      padding: 10px;
      margin-right: 10px;
      width: 30%;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="chat">
    <h1>Real-Time Chat App</h1>
    <div id="messages"></div>

    <input type="text" id="username" placeholder="Your name" />
    <input type="text" id="message" placeholder="Type a message" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const socket = io();
    const messagesDiv = document.getElementById("messages");

    socket.on("load messages", (messages) => {
      messagesDiv.innerHTML = "";
      messages.forEach((msg) => addMessage(msg.username, msg.text, msg.timestamp));
    });

    socket.on("chat message", (msg) => {
      addMessage(msg.username, msg.text, msg.timestamp);
    });

    function sendMessage() {
      const username = document.getElementById("username").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!username || !message) return;

      socket.emit("chat message", {
        username,
        text: message
      });

      document.getElementById("message").value = "";
    }

    function addMessage(username, text, timestamp) {
      const div = document.createElement("div");
      div.className = "message";

      const date = timestamp ? new Date(timestamp).toLocaleString() : new Date().toLocaleString();
      div.innerHTML = `<strong>${username}</strong>: ${text} <br><small>${date}</small>`;

      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
